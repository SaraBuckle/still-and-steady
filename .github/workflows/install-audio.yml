name: Install meditation audio
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-audio.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated audio
        env:
          AUDIO_URL: 'https://storage.googleapis.com/xi-backend/database/workspace/ce04059a20e64542bb3c59a408c79310/content_generation/XqUBee0E7mSu9VJCPXIZ/jwWXYQ9nXAtFnFaVRB2Z/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261020%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261020T081657Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
        run: |
          mkdir -p audio
          curl --fail --location --retry 3 "$AUDIO_URL" --output audio/steady-moment.mp3
          test -s audio/steady-moment.mp3
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/steady-moment.mp3
          git diff --cached --quiet || (git commit -m "Add gentle ElevenLabs meditation audio" && git push)
